# Builds the YouTube downloader as a single Windows EXE.
# The EXE is attached to every run (Actions → run → Artifacts) and published
# to the "yt-downloader" release so it can be downloaded and shared.
name: yt-downloader EXE

on:
  push:
    paths: ["yt-downloader/**", ".github/workflows/yt-downloader-exe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: yt-downloader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pywebview

      - name: Build EXE
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name YouTubeDownloader
          --icon assets/icon.ico
          --add-data "static;static"
          --collect-all webview
          app.py

      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process dist\YouTubeDownloader.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader
          path: yt-downloader/dist/YouTubeDownloader.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yt-downloader
          name: מוריד יוטיוב (build ${{ github.run_number }})
          body: |
            הורדה: YouTubeDownloader.exe – לחיצה כפולה ומתחילים. אין צורך להתקין כלום.
            Built from ${{ github.sha }} on ${{ github.ref_name }}.
          prerelease: ${{ github.ref_name != 'main' }}
          files: yt-downloader/dist/YouTubeDownloader.exe
